name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          jq -e .KPlugin.Id metadata.json
          bash -n contents/scripts/claude-usage

      - name: Build .plasmoid
        run: bash pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plasmoid
          path: '*.plasmoid'

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.plasmoid --title "$GITHUB_REF_NAME" --generate-notes
